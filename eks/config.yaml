eks:
  # Keep this on a release still in EKS standard support - a version that falls
  # into extended support keeps running at roughly six times the control-plane
  # cost, and the switch happens automatically.
  # 1.34 standard support ends 2026-12-01. `aws eks describe-cluster-versions`.
  kubernetes_version: "1.34"

  node_instance_types:
    - t3.medium
  node_desired_size: 2
  node_min_size: 1
  node_max_size: 3

  # API means cluster access comes only from the access entries the module
  # creates, so an empty admin list locks everyone out.
  #
  # The admin ARNs themselves are not here: they are Identity Center role ARNs
  # carrying the account id, and this file is committed. See .env.
  authentication_mode: API

  # No EKS managed add-ons any more. vpc-cni, coredns, kube-proxy and
  # aws-ebs-csi-driver are now Flux-managed Helm charts, in gitops-flux under
  # infrastructures/base/<chart>.
  #
  # This map is emptied rather than deleted: eks/main.tf reads the key, so it
  # has to exist.
  #
  # Removing them here UNREGISTERS the add-ons from EKS and leaves the running
  # pods alone, because aws_eks_addon carries preserve = true
  # (modules/eks/addons.tf). Without that this would delete pod networking and
  # DNS from a live cluster.
  #
  # Versions running at handover. The Helm charts are pinned to match, and this
  # is what a rollback restores:
  #   vpc-cni             v1.22.3-eksbuild.1
  #   coredns             v1.12.4-eksbuild.18
  #   kube-proxy          v1.34.6-eksbuild.17
  #   aws-ebs-csi-driver  v1.63.1-eksbuild.1
  #
  # To roll back: restore the four lines above and apply - but suspend the Flux
  # HelmReleases first, or EKS and Helm will both claim the same objects.
  cluster_addons: {}

  # Emptied along with cluster_addons above. Every setting that used to be here
  # is now a Helm value on the matching HelmRelease in gitops-flux.
  #
  # They must keep matching what is RUNNING. If a chart renders a different spec
  # than the live object, Helm does not just take ownership on adoption - it
  # rolls the pods. For coredns or vpc-cni that is a cluster-wide event.
  #
  # What was declared here, and therefore what the charts must reproduce:
  #
  #   vpc-cni             env AWS_VPC_K8S_CNI_LOGLEVEL=INFO
  #                       requests cpu 25m, memory 64Mi
  #                       (ENABLE_PREFIX_DELEGATION deliberately unset - kubelet
  #                        --max-pods is fixed at node bootstrap, so it buys
  #                        nothing on a running node)
  #
  #   coredns             replicaCount 2
  #                       podDisruptionBudget maxUnavailable 1
  #                       requests cpu 100m, memory 70Mi; limits memory 170Mi
  #
  #   kube-proxy          mode iptables (ipvs is deprecated in 1.35, and this
  #                       cluster has always been iptables)
  #                       requests cpu 25m, memory 64Mi
  #
  #   aws-ebs-csi-driver  a gp3 StorageClass marked default. Without one every
  #                       PersistentVolumeClaim sits Pending forever - the old
  #                       gp2 class uses the in-tree provisioner removed in 1.34.
  cluster_addon_config: {}
  authentication_mode: API
