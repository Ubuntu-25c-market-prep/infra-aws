eks:
  # Keep this on a release still in EKS standard support - a version that falls
  # into extended support keeps running at roughly six times the control-plane
  # cost, and the switch happens automatically.
  # 1.34 standard support ends 2026-12-01. `aws eks describe-cluster-versions`.
  kubernetes_version: "1.34"

  node_instance_types:
    - t3.medium
  node_desired_size: 2
  node_min_size: 1
  node_max_size: 3

  # API means cluster access comes only from the access entries the module
  # creates, so an empty admin list locks everyone out.
  #
  # The admin ARNs themselves are not here: they are Identity Center role ARNs
  # carrying the account id, and this file is committed. See .env.
  authentication_mode: API

  # EKS managed add-ons. These are AWS objects installed by the control plane,
  # not Helm charts - platform add-ons (cert-manager, Istio, Prometheus) are
  # Flux's job and live in gitops-flux.
  #
  # Versions are PINNED, not left empty, so nothing moves without a reviewed
  # commit.
  #
  # These must move together with kubernetes_version above: an add-on version is
  # only supported against the Kubernetes versions AWS lists it for. Read the
  # default for a version with:
  #   aws eks describe-addon-versions --addon-name vpc-cni \
  #     --kubernetes-version 1.34 \
  #     --query 'addons[0].addonVersions[?compatibilities[0].defaultVersion==`true`].addonVersion'
  #
  # Every add-on here is on the 1.34 default. Keep it that way: moving one of
  # them independently of kubernetes_version is how a cluster ends up on a
  # combination AWS does not test.
  cluster_addons:
    vpc-cni: "v1.22.3-eksbuild.1"            # 1.34 default
    coredns: "v1.12.4-eksbuild.18"           # 1.34 default
    kube-proxy: "v1.34.6-eksbuild.17"        # 1.34 default
    aws-ebs-csi-driver: "v1.63.1-eksbuild.1" # 1.34 default

  # Settings this repository declares for each add-on. An add-on listed here is
  # switched to resolve_conflicts_on_update = OVERWRITE, so Terraform becomes
  # the only writer and anything NOT declared resets to the add-on default.
  # An add-on absent from this map is left on defaults and PRESERVE.
  #
  # The schema differs per add-on and per version:
  #   aws eks describe-addon-configuration --addon-name coredns \
  #     --addon-version v1.12.4-eksbuild.17 --query configurationSchema
  #
  cluster_addon_config:

    vpc-cni:
      env:
        # The daemon defaults to DEBUG, which is a lot of log volume per node
        # for no routine benefit. Put it back to DEBUG while debugging pod
        # networking, not before.
        AWS_VPC_K8S_CNI_LOGLEVEL: "INFO"
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
      #
      # ENABLE_PREFIX_DELEGATION is deliberately NOT set here. It raises how
      # many IPs a node can hand out, but kubelet's --max-pods is fixed at node
      # bootstrap (17 on t3.medium) and prefix delegation does not change it on
      # a running node. Setting it alone buys nothing and reads as though pod
      # density were solved. Raising density is a node-group change: bootstrap
      # arguments, a larger instance type, or Karpenter.

    aws-ebs-csi-driver:
      # The only functional change here. Creates a gp3 StorageClass marked
      # default - without one, every PersistentVolumeClaim on this cluster sits
      # Pending forever. The existing gp2 class uses kubernetes.io/aws-ebs, the
      # in-tree provisioner removed in Kubernetes 1.34, so it cannot provision.
      defaultStorageClass:
        enabled: true

    coredns:
      # These match what the cluster already runs. Declared so an add-on
      # default changing upstream cannot silently move them.
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      resources:
        requests:
          cpu: 100m
          memory: 70Mi
        limits:
          memory: 170Mi

    kube-proxy:
      # Explicit: ipvs mode is deprecated in Kubernetes 1.35, and this cluster
      # has always been iptables. Stating it stops a future default from
      # changing the data path silently.
      mode: iptables
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
  authentication_mode: API
