###############################################################################
# Shared configuration for the workload-account layers.
#
# `common` is merged into every layer; each layer then reads its own section.
# Values that used to be duplicated across each layer's terraform.tfvars -
# region, org_prefix - are written once here.
#
# SECRETS DO NOT GO IN THIS FILE. It is committed and this repository is
# public. account_id and admin_principal_arns both embed the account id, so
# they stay terraform variables fed by the gitignored terraform.tfvars (locally)
# and the TFVARS_<LAYER> secret (in CI).
###############################################################################

common:
  region: us-east-1
  org_prefix: u25c

# Layer 5 - infra-aws/network
network:
  # The module carves one /24 public subnet per availability zone out of this.
  vpc_cidr: 10.0.0.0/16
  # Two is the EKS minimum and what ADR 0006 specifies.
  az_count: 2

  # Both required by EKS. A VPC not running a cluster can turn them off.
  enable_dns_support: true
  enable_dns_hostnames: true

  # default | dedicated | host
  instance_tenancy: default

  # False gives a VPC with no route to the internet; the default route in the
  # module disappears with it.
  create_internet_gateway: true

  # This is what makes the subnets public - ADR 0005 (no NAT) depends on it.
  map_public_ip_on_launch: true

  # Free, and keeps ECR image-layer pulls (stored in S3) off the public path.
  enable_s3_gateway_endpoint: true

  # Lets the AWS Load Balancer Controller discover these subnets for public ELBs.
  subnet_tags:
    "kubernetes.io/role/elb": "1"

  # Extra routes on the public route table, keyed by a name that only labels the
  # route in state. Set exactly one target per route, e.g.
  #   to_office:
  #     destination_cidr_block: 10.5.0.0/16
  #     transit_gateway_id: tgw-0123456789abcdef0
  # The 0.0.0.0/0 route to the IGW is created by create_internet_gateway.
  extra_routes: {}

# Layer 7 - infra-aws/eks
eks:
  # Keep this on a release still in EKS standard support - a version that falls
  # into extended support keeps running at roughly six times the control-plane
  # cost, and the switch happens automatically.
  # 1.34 standard support ends 2026-12-01. `aws eks describe-cluster-versions`.
  kubernetes_version: "1.34"

  node_instance_types:
    - t3.medium
  node_desired_size: 2
  node_min_size: 1
  node_max_size: 3

  # API means cluster access comes only from the access entries the module
  # creates, so an empty admin list locks everyone out.
  #
  # The admin ARNs themselves are not here: they are Identity Center role ARNs
  # carrying the account id, and this file is committed. See .env.
  authentication_mode: API
